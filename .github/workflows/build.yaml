name: CG-3 IDE CI Build

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: dependencies
      run: |
           sudo apt-get -q update
           sudo apt-get -qfy install --no-install-recommends cmake build-essential qt6-5compat-dev qt6-base-dev-tools
    - name: qt-cmake
      run: /usr/lib/qt6/bin/qt-cmake .
    - name: make
      run: make -j
    - name: make install
      run: sudo make install
